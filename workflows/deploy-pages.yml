name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create build directory
        run: mkdir -p _site

      - name: Copy frontend files
        run: |
          cp farmpoa-ui-kit/*.html _site/ 2>/dev/null || true
          cp farmpoa-ui-kit/*.css _site/ 2>/dev/null || true
          cp -r farmpoa-ui-kit/assets _site/ 2>/dev/null || true
          [ -d "public" ] && cp -r public/* _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
