version: '3.9'

services:
  # ── FarmPOA API ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runner
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      LOG_PRETTY: 'true'
      LOG_LEVEL: debug
    volumes:
      - ./src:/app/src:ro   # hot reload via tsx watch
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - farmpoa-net
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`api.farmpoa.local`)'

  # ── Dev server (tsx watch) ─────────────────────────────────────────────────
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      LOG_PRETTY: 'true'
    command: npx tsx watch src/server.ts
    networks:
      - farmpoa-net
    profiles:
      - dev

  # ── Redis (OTP / session cache) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-devpassword}
    volumes:
      - redis-data:/data
    networks:
      - farmpoa-net
    restart: unless-stopped

  # ── Prometheus metrics ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - '9090:9090'
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - farmpoa-net
    profiles:
      - monitoring

networks:
  farmpoa-net:
    driver: bridge

volumes:
  redis-data:
