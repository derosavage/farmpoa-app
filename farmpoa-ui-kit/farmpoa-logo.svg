<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <!-- Leaf gradient: fresh green to pink -->
    <linearGradient id="leafGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8BC34A"/>
      <stop offset="100%" style="stop-color:#E91E63"/>
    </linearGradient>

    <!-- Subtle shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Icon Group (Left side) -->
  <g transform="translate(10, 5)" filter="url(#shadow)">
    <!-- Circular background -->
    <circle cx="35" cy="35" r="32" fill="#FFFFFF" stroke="#E8F5E9" stroke-width="2"/>

    <!-- Leaf forming letter "F" -->
    <g transform="translate(35, 35)">
      <!-- Main leaf body forming the F stem and right arm -->
      <path d="M-8 -28
               C-8 -32, -4 -34, 2 -32
               L2 -8
               C8 -4, 12 2, 10 8
               C14 14, 12 22, 6 26
               L-4 22
               C-2 18, -4 14, -6 10
               L-6 -2
               C-12 -6, -16 -14, -14 -20
               C-16 -24, -12 -28, -8 -28Z"
            fill="url(#leafGradient)"/>

      <!-- F left arm / leaf accent -->
      <path d="M-8 -12
               C-16 -14, -24 -8, -26 -2
               C-28 4, -24 12, -18 14
               L-12 12
               C-16 10, -18 6, -16 2
               C-14 -2, -10 -6, -6 -6
               L-8 -12Z"
            fill="url(#leafGradient)" opacity="0.9"/>

      <!-- F crossbar / leaf detail -->
      <path d="M-2 -4
               C4 -6, 10 -2, 12 4
               C14 10, 10 16, 4 16
               L-2 14
               C2 12, 4 8, 3 4
               C2 0, -1 -2, -2 -4Z"
            fill="url(#leafGradient)" opacity="0.85"/>

      <!-- Central vein for organic feel -->
      <path d="M-4 -26 Q0 -10, -2 24"
            stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Brand Name (Right side) -->
  <g transform="translate(95, 28)">
    <!-- "farmpoa" in bold clean sans-serif -->
    <text x="0" y="32"
          font-family="'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="38"
          font-weight="700"
          fill="#2E7D32"
          letter-spacing="-1">
      farmpoa
    </text>

    <!-- Subtle tagline underline accent -->
    <rect x="2" y="42" width="140" height="3" rx="1.5" fill="url(#leafGradient)" opacity="0.6"/>
  </g>
</svg>